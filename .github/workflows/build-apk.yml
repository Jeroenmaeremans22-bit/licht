# Bouwt bij elke wijziging automatisch een installatiebestand (APK) voor Android
# en zet het bij Releases. Downloadlink op je gsm:
#   https://github.com/<jouw-naam>/<repo>/releases/latest/download/licht.apk
name: Android-app bouwen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK controleren
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Onderdelen installeren
        run: npm ci

      - name: Android-project maken
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Bestand klaarzetten
        run: cp android/app/build/outputs/apk/release/app-release.apk licht.apk

      - name: Release maken
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Licht ${{ github.run_number }}
          body: Tik op licht.apk om te downloaden en te installeren.
          files: licht.apk
          make_latest: true
